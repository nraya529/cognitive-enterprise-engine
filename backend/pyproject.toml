[project]
name = "cognitive-enterprise-engine"
version = "0.1.0"
description = "Autonomous multi-agent system for back-office automation"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
